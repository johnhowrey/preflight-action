name: Test
on:
  push:
  workflow_dispatch:
jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Scan Toolbox and fail on high findings
        id: scan
        uses: ./
        with:
          url: https://toolbox.allthepossibles.com/mcp
          fail-on: high
      - name: Check outputs are set
        env:
          VERDICT: ${{ steps.scan.outputs.verdict }}
          FINDINGS: ${{ steps.scan.outputs.findings-json }}
        run: |
          test -n "$VERDICT"
          echo "$FINDINGS" | jq -e 'type == "array"'
      - name: Gate must fail on a known finding
        id: gate
        continue-on-error: true
        uses: ./
        with:
          url: https://toolbox.allthepossibles.com/mcp
          fail-on: low
      - name: Confirm the gate failed
        run: test "${{ steps.gate.outcome }}" = "failure"
